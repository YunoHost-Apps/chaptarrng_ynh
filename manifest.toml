#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "chaptarrng"
name = "ChaptarrNG"
description.en = "Manage audiobook libraries, chapter metadata, and conversions"
description.fr = "Gestion des bibliothèques de livres audio, des métadonnées des chapitres et des conversions"

version = "0.9.938~ynh4"

maintainers = ["snapetech"]

[upstream]
license = "GPL-3.0-only"
code = "https://github.com/snapetech/chaptarrng"
admindoc = "https://github.com/snapetech/chaptarrng#readme"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "1G"
ram.build = "100M"
ram.runtime = "512M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "admins"

[resources]

    [resources.sources]
    
        [resources.sources.main]
        in_subdir = false
        format = "tar.gz"
        amd64.url = "https://github.com/snapetech/chaptarrng/releases/download/v0.9.938/chaptarrng-v0.9.938-linux-amd64-yunohost.tar.gz"
        amd64.sha256 = "b6f9a3da63c96b04ecdc020ad117a7b84f17d85f2ca1363a07547b5a2fad15ab"
        arm64.url = "https://github.com/snapetech/chaptarrng/releases/download/v0.9.938/chaptarrng-v0.9.938-linux-arm64-yunohost.tar.gz"
        arm64.sha256 = "67de01fd00e2884cf2097b617d392c26cf613f5fccb5cf2670e066e25661019f"
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.amd64 = "^chaptarrng-v.*-linux-amd64-yunohost\\.tar\\.gz$"
        autoupdate.asset.arm64 = "^chaptarrng-v.*-linux-arm64-yunohost\\.tar\\.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    [resources.ports]
    main.default = 8789
    main.exposed = false

    [resources.apt]
    packages = "ffmpeg, php8.5-cli, php8.5-mbstring, php8.5-xml, php8.5-curl, php8.5-zip, php8.5-sqlite3, sqlite3, libsqlite3-0, rsync"
